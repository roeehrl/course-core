name: Verified release candidates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable-intent tag matching the root version; dispatch this workflow FROM that tag
        required: true
        type: string
      commit:
        description: Full 40-character commit SHA to test and package
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Bind release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          package-manager-cache: false
      - id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TESTED_COMMIT: ${{ inputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-artifacts.mjs identity --tag "$RELEASE_TAG" --commit "$TESTED_COMMIT"

  full-ci:
    name: Full CI
    needs: identity
    # A local reusable workflow is resolved at the SAME commit as this workflow.
    # Parent owns adding workflow_call to ci.yml. No secrets are inherited.
    # A job that calls a workflow cannot set timeout-minutes: every called ci.yml job keeps
    # its own measured timeout (each API job 30 min, the required API gate 5 min), and
    # release-artifacts.mjs requires every Full CI job, the API jobs included, to pass.
    uses: ./.github/workflows/ci.yml

  candidates:
    name: Assemble verified candidates
    needs: [identity, full-ci]
    if: ${{ needs.full-ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only this job may mint an OIDC token, and only to sign build provenance
    # for the verified candidate files. It has no publishing authority.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Bind successful CI jobs, build isolated source, pack and install-test
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          TESTED_COMMIT: ${{ needs.identity.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-artifacts.mjs prepare --tag "$RELEASE_TAG" --commit "$TESTED_COMMIT" --output "$RUNNER_TEMP/course-core-candidates"
      - name: Recheck bytes and live tag/CI identity immediately before upload
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          TESTED_COMMIT: ${{ needs.identity.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-artifacts.mjs verify --directory "$RUNNER_TEMP/course-core-candidates" --tag "$RELEASE_TAG" --commit "$TESTED_COMMIT"
      # Provenance covers every candidate file: the archives, the CycloneDX SBOM,
      # release-manifest.json and SHA256SUMS. Verify later with
      # `gh attestation verify <file> --repo roeehrl/course-core`.
      - name: Attest build provenance for the verified candidate files
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/course-core-candidates/*
      - id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: course-core-${{ needs.identity.outputs.tag }}-${{ needs.identity.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/course-core-candidates/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
      - name: Record immutable candidate download identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: |
          {
            printf 'Candidate artifact ID: %s\nSHA-256 upload digest: %s\nDownload: %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL"
            printf 'Build provenance attestation: %s (covers every candidate file, including the CycloneDX SBOM listed in SHA256SUMS)\n' "$ATTESTATION_ID"
            printf 'Verified candidates only. No tag, GitHub release, npm publication or deployment was performed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
