# Course Core self-host stack for one Linux server with Docker. See README.md here.
#   cp deploy/docker/.env.example deploy/docker/.env   # then edit; never commit .env
#   docker compose -f deploy/docker/compose.yaml --env-file deploy/docker/.env up -d --build --wait
# Only the proxy publishes ports. PostgreSQL, the API and Temporal stay on the private
# network. Every third-party image is pinned by version and digest; update both together.
name: course-core

x-core-image: &core-image
  image: ${COURSE_CORE_IMAGE:-course-core-selfhost:local}
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile

services:
  db:
    image: postgres:17.11@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_core
      POSTGRES_USER: course
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the env file}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U course -d course_core']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [course]

  api:
    <<: *core-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://course:${POSTGRES_PASSWORD}@db:5432/course_core
      PUBLIC_ORIGIN: https://${COURSE_HOSTNAME:?Set COURSE_HOSTNAME in the env file}:${COURSE_HTTPS_PORT:-443}
      API_HOST: 0.0.0.0
      PORT: '4310'
      # Only the proxy's fixed address may name the client in X-Forwarded-For.
      TRUSTED_PROXIES: ${COURSE_PROXY_ADDRESS:-172.30.89.10}
      AUTH_LOGIN_CODES: ${AUTH_LOGIN_CODES:-disabled}
      SUPERVISOR_HOST_TOKEN: ${SUPERVISOR_HOST_TOKEN:-}
      SUPERVISOR_WORKSPACE_IDS: ${SUPERVISOR_WORKSPACE_IDS:-}
    volumes:
      - core-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4310/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    networks: [course]

  proxy:
    image: caddy:2.11.2@sha256:25cdc846626b62d05f6b633b9b40c2c9f6ef89b515dc76133cefd920f7dbe562
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      COURSE_HOSTNAME: ${COURSE_HOSTNAME:?Set COURSE_HOSTNAME in the env file}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - ${COURSE_BIND_ADDRESS:-0.0.0.0}:${COURSE_HTTP_PORT:-80}:80
      - ${COURSE_BIND_ADDRESS:-0.0.0.0}:${COURSE_HTTPS_PORT:-443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      course:
        ipv4_address: ${COURSE_PROXY_ADDRESS:-172.30.89.10}
        # Workers reach the API through the proxy by its public name, over HTTPS.
        aliases: ['${COURSE_HOSTNAME:?Set COURSE_HOSTNAME in the env file}']

  # Optional supervision (profile "supervision"): a local Temporal development server and
  # the bounded worker and dispatcher. They share Temporal's network namespace, so Temporal
  # listens on loopback only and is never reachable from the network.
  temporal:
    <<: *core-image
    profiles: [supervision]
    restart: unless-stopped
    command: ['temporal', 'server', 'start-dev', '--ip', '127.0.0.1', '--port', '7233', '--headless', '--db-filename', '/data/temporal.db']
    environment:
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: '2'
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    networks: [course]

  # One-shot: with CADDY_GLOBAL_OPTIONS=local_certs, publish the proxy's root certificate
  # (not its key) where the unprivileged supervisor can read it. Exits at once otherwise.
  proxy-ca:
    image: caddy:2.11.2@sha256:25cdc846626b62d05f6b633b9b40c2c9f6ef89b515dc76133cefd920f7dbe562
    profiles: [supervision]
    restart: 'no'
    depends_on:
      proxy:
        condition: service_healthy
    entrypoint: ['sh', '-c', 'root=/data/caddy/pki/authorities/local/root.crt; if [ -f "$$root" ]; then install -m 0644 "$$root" /out/root.crt; fi']
    volumes:
      - proxy-data:/data:ro
      - proxy-ca:/out
    network_mode: none

  worker:
    <<: *core-image
    profiles: [supervision]
    restart: unless-stopped
    network_mode: service:temporal
    depends_on:
      temporal:
        condition: service_healthy
      proxy-ca:
        condition: service_completed_successfully
    working_dir: /app/services/supervisor
    # The proxy's own root certificate (local_certs only), copied readable by proxy-ca.
    volumes: &supervisor-volumes
      - proxy-ca:/proxy-ca:ro
    command: ['node', '--max-old-space-size=384', 'dist/src/cli.js', 'worker']
    environment: &supervisor-environment
      SUPERVISOR_TEMPORAL_ADDRESS: 127.0.0.1:7233
      SUPERVISOR_TEMPORAL_NAMESPACE: default
      SUPERVISOR_TEMPORAL_TASK_QUEUE: ${SUPERVISOR_TASK_QUEUE:-course-core}
      SUPERVISOR_TEMPORAL_TLS: 'false'
      SUPERVISOR_HOST_URL: https://${COURSE_HOSTNAME:?Set COURSE_HOSTNAME in the env file}
      SUPERVISOR_HOST_TOKEN: ${SUPERVISOR_HOST_TOKEN:-}
      SUPERVISOR_PROVIDER_URL: https://${COURSE_HOSTNAME:?Set COURSE_HOSTNAME in the env file}
      SUPERVISOR_PROVIDER_TOKEN: ${SUPERVISOR_HOST_TOKEN:-}
      SUPERVISOR_ACTIVITY_CONCURRENCY: '2'
      SUPERVISOR_DISPATCH_INTERVAL_MS: '5000'
      NODE_EXTRA_CA_CERTS: ${COURSE_EXTRA_CA_CERTS:-}

  dispatcher:
    <<: *core-image
    profiles: [supervision]
    restart: unless-stopped
    network_mode: service:temporal
    depends_on:
      temporal:
        condition: service_healthy
      proxy-ca:
        condition: service_completed_successfully
    working_dir: /app/services/supervisor
    volumes: *supervisor-volumes
    command: ['node', '--max-old-space-size=256', 'dist/src/cli.js', 'dispatch-loop']
    environment: *supervisor-environment

networks:
  course:
    ipam:
      config:
        # The proxy has a fixed address (TRUSTED_PROXIES); other containers draw from ip_range.
        - subnet: ${COURSE_SUBNET:-172.30.89.0/24}
          ip_range: ${COURSE_DYNAMIC_RANGE:-172.30.89.128/25}

volumes:
  db-data:
  core-data:
  proxy-data:
  proxy-config:
  proxy-ca:
  temporal-data:
